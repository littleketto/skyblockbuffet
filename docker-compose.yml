services:
  db:
    image: postgres:16-alpine
    container_name: skyblockbuffet-db
    restart: always
    environment:
      POSTGRES_USER: skyblock
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: skyblock_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyblock -d skyblock_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skyblockbuffet-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=skyblock
      - POSTGRES_PASSWORD=change_me_in_production
      - POSTGRES_DB=skyblock_analyzer
      - PROJECT_NAME=Skyblock Buffet Economy Analyzer
      - API_V1_STR=/api/v1
      - BAZAAR_TAX_RATE=0.01125
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    external: true
    name: skyblock-analyzer_pgdata
